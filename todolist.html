<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
            background-color: lightblue;
        }
        .todolist {
            width: 500px;
            height: 500px;
            border: 2px solid rgb(255, 0, 0);
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 5px 10px #888888;
            background: linear-gradient(to bottom right, #33ccff 0%, #f0b0e0 100%); 
               }
        .button {
            background-color: rgb(0, 128, 255);
            color: white;
            padding: 10px 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .parent {
        width: 500px;
        height: 500px;
        border: 2px solid red;
        margin: 0 auto;
      }
      button {
        background-color: rgb(0, 128, 255);
        color: white;
        padding: 10px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      li {
        text-align: left;
        border: 1px solid black;
        background: linear-gradient(to left, #33ccff 0%, #f0b0e0 100%); 
        border-radius: 15px;
        width: 400px;
        height: 40px;
        margin: 10px auto;
        text-align: center;
        list-style-type: none;
      }
    </style>
</head>
<body>
    <h1>To Do List</h1>
    <div class="todolist">
        <br>
        <label>Todo List Input:</label>
        <input type="text" id="task" name="task">
        <button id="button">Add Task</button>
        <div id="list"></div>
    </div>
    
    <script>
        let button = document.getElementById("button");
        let unorderdList = document.createElement("ol");
        let list = document.getElementById("list");
        let inputValue = document.getElementById("task");
        button.addEventListener("click", function () {
        let values = inputValue.value;
        console.log(values);
        if (values === "") {
          let text = document.createElement("p");
          text.innerText = "";
          list.appendChild(text);
        }
        let listItem = document.createElement("li");
        listItem.classList.add("list-item");
        listItem.innerText = values;
        unorderdList.appendChild(listItem);
        list.appendChild(unorderdList);
        document.getElementById("text").value = "";
      });
    </script>
</body>
</html>
